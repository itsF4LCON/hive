name: sensor

on:
  push:
    branches: [main]
    paths: ["sensor/**", ".github/workflows/sensor.yml"]
    tags: ["v*"]
  pull_request:
    paths: ["sensor/**"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: sensor
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - run: cargo build --release --locked
      - run: cp target/release/hive-sensor hive-sensor-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: hive-sensor-${{ matrix.target }}
          path: sensor/hive-sensor-${{ matrix.target }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: sha256sum hive-sensor-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            hive-sensor-*
            SHA256SUMS
