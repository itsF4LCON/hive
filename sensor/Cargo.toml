[package]
name = "hive-sensor"
version = "0.2.0"
edition = "2021"
authors = ["itsF4LCON <107556180+itsF4LCON@users.noreply.github.com>"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"] }
russh = "0.63"
rand = "0.10"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
maxminddb = { version = "0.32", features = ["mmap"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
